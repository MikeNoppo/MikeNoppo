  <title>Kibana</title>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      :root:not(:target) .mark { animation: arrive 460ms cubic-bezier(.2,.75,.2,1) 1088ms both; }
      :root:not(:target) .glow { animation: pulse 7000ms ease-in-out 5490ms infinite; }
