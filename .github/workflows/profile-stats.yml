name: Refresh profile assets

on:
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Render contribution charts
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/render_activity.py "$PROFILE_LOGIN"

      - name: Render animated skill badges
        run: python3 scripts/render_skill_badges.py

      - name: Publish updated assets
        run: |
          git add assets/github-activity.svg assets/github-activity-mobile.svg assets/skill-badges
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(profile): refresh generated profile assets'
          git push origin "HEAD:$GITHUB_REF"
